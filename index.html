
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vivienda en realidad aumentada</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
  </script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    model-viewer {
      width: 100%;
      height: 85vh;
      background: #f2f2f2;
    }
    h2 { text-align: center; }
    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h2>Vivienda arquitectónica - Realidad aumentada</h2>
  <model-viewer
    src="./00.glb"
    alt="Maqueta digital de vivienda"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto">
    <button slot="ar-button">
      Ver en realidad aumentada
    </button>
  </model-viewer>
</body>
</html>
